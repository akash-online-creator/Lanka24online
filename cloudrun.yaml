apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sahaya-sewa-service
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    description: "1+ සහය සේවා (Sahaya Sewa) - Auto-scaling Cloud Run Production Service"
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 🚀 Horizontal Auto-scaling: instances 1 to 50 on traffic surges
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "50"
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/sahaya-sewa/app:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "" # Set to Cloud Memorystore or Upstash Redis URL
            - name: R2_BUCKET_NAME
              value: "sahaya-storage"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
