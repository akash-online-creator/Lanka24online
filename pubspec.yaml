name: sahayasewa_mobile
description: "Sahaya Sewa Android App with Background Location & Floating Overlay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  flutter_overlay_window: ^0.5.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
