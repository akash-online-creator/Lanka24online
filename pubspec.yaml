name: sahayasewa_mobile
description: "Sahaya Sewa Android App with Background Location & Floating Overlay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: any
  flutter_overlay_window: any
  geolocator: ^13.0.2
  permission_handler: any
  shared_preferences: any
  webview_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
