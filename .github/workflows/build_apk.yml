name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Official Production Web Application Bundle
        run: |
          echo "Fetching verified production web bundle from https://supporservice.online/..."
          mkdir -p assets/web
          curl -sL https://supporservice.online/ -o assets/web/index.html
          curl -sL https://supporservice.online/manifest.json -o assets/web/manifest.json || true
          curl -sL https://supporservice.online/logo.jpg -o assets/web/logo.jpg || true
          ls -lh assets/web/

      - name: Set up Python & Pillow for Image Processing
        run: |
          python3 -m pip install --upgrade pillow

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Scaffold Pristine Android Platform (Java Binding)
        run: |
          echo "Generating official Android platform scaffolding..."
          rm -rf android
          flutter create . --platforms=android --project-name=sahayasewa_mobile --org=com.sahayasewa -a java
          
          # Configure minSdk & multiDex in app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true

          # Apply branding, icons, strings & manifest permissions
          python3 scripts/prepare_android.py

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Patch Third-Party Plugins for SDK 34 & AGP 8 Compatibility
        run: |
          echo "Patching pub-cache plugins..."
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/project.android.flutter.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/21/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} + || true

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Output
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahayaSewa-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
