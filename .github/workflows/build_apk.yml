name: Build Release APK


on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/apk/**'
      - '**.md'
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Firebase Config
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG }}" > firebase-applet-config.json
          fi
          python3 -c "
          import json, os
          valid = False
          if os.path.exists('firebase-applet-config.json'):
              try:
                  with open('firebase-applet-config.json') as f:
                      d = json.load(f)
                      if isinstance(d, dict) and d.get('projectId'):
                          valid = True
              except Exception:
                  pass
          if not valid:
              cfg = {
                  'projectId': 'gen-lang-client-0262698872',
                  'appId': '1:503381962483:web:4bda294cd68823f579d186',
                  'apiKey': 'AIzaSyBtTtuWnl4-orEHh9JkPHtkE5_z794EhpQ',
                  'authDomain': 'gen-lang-client-0262698872.firebaseapp.com',
                  'firestoreDatabaseId': 'ai-studio-sahayaseva-08bfd3be-2f42-4de8-a3a8-ad7279ec7d1f',
                  'storageBucket': 'gen-lang-client-0262698872.firebasestorage.app',
                  'messagingSenderId': '503381962483',
                  'measurementId': '',
                  'oAuthClientId': '503381962483-rh75ngs14tg41fd5728i5ef7rcjk86dn.apps.googleusercontent.com',
                  'recaptchaSiteKey': ''
              }
              with open('firebase-applet-config.json', 'w') as f:
                  json.dump(cfg, f, indent=2)
              print('Generated valid firebase-applet-config.json')
          "


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install and Build Web
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build
          mkdir -p assets/web
          cp -r dist/* assets/web/ 2>/dev/null || true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'


      - name: Precache Flutter Android Artifacts
        run: flutter precache --android


      - name: Configure Android Build & Fix Dependencies
        run: |
          flutter pub add geolocator_android:4.6.1 --dev || true
          if [ -f scripts/prepare_android.py ]; then
            python3 scripts/prepare_android.py
          fi


          python3 -c "
          import os
          p = 'android/settings.gradle'
          if os.path.exists(p):
              with open(p, 'r') as f:
                  c = f.read()
              if 'download.flutter.io' not in c:
                  c = c.replace('repositories {', 'repositories {\n        maven { url \"https://storage.googleapis.com/download.flutter.io\" }')
                  with open(p, 'w') as f:
                      f.write(c)
          "
          find android/app/src/main/res -name "ic_launcher*.xml" -delete || true
          rm -rf android/app/src/main/java/io


          python3 -m pip install pillow --quiet
          python3 -c "
          import os
          from PIL import Image
          densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          logo = next((p for p in ['assets/web/logo.jpg', 'assets/web/logo.png', 'public/logo.png', 'dist/logo.png'] if os.path.exists(p)), None)
          for folder, size in densities.items():
              d = os.path.join('android/app/src/main/res', folder)
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, 'ic_launcher.png')
              if logo:
                  try:
                      Image.open(logo).convert('RGBA').resize((size, size)).save(p, 'PNG')
                      continue
                  except Exception:
                      pass
              Image.new('RGBA', (size, size), (0, 122, 75, 255)).save(p, 'PNG')
          "


          FLUTTER_BIN=$(which flutter)
          FLUTTER_DIR=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "flutter.sdk=$FLUTTER_DIR" > android/local.properties
          python3 -c '
          import os, base64
          b64_main = ""
          b64_svc = ""
          pkg_dir = "android/app/src/main/java/com/sahayasewa/app"
          os.makedirs(pkg_dir, exist_ok=True)
          with open(os.path.join(pkg_dir, "MainActivity.java"), "wb") as f:
              f.write(base64.b64decode(b64_main))
          with open(os.path.join(pkg_dir, "RedAlertMonitorService.java"), "wb") as f:
              f.write(base64.b64decode(b64_svc))
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = ["android.permission.INTERNET", "android.permission.WAKE_LOCK", "android.permission.VIBRATE", "android.permission.FOREGROUND_SERVICE", "android.permission.POST_NOTIFICATIONS", "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "android.permission.SCHEDULE_EXACT_ALARM"]
              perm_tags = ""
              for p in perms:
                  if p not in m:
                      perm_tags += chr(60) + "uses-permission android:name=\"" + p + "\"" + chr(47) + chr(62) + "\n    "
              if perm_tags:
                  m = m.replace(chr(60) + "application", perm_tags + chr(60) + "application", 1)
              if "RedAlertMonitorService" not in m:
                  svc_tag = "    " + chr(60) + "service android:name=\".RedAlertMonitorService\" android:enabled=\"true\" android:exported=\"false\" android:stopWithTask=\"false\"" + chr(47) + chr(62) + "\n    " + chr(60) + chr(47) + "application" + chr(62)
                  m = m.replace(chr(60) + chr(47) + "application" + chr(62), svc_tag, 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          '

      - name: Build Android Release APK
        run:
          flutter clean &&
          flutter pub get &&
          BUILD_NUM=$((10 + ${{ github.run_number }})) &&
          flutter build apk --release --no-tree-shake-icons --build-name="1.1.${{ github.run_number }}" --build-number="$BUILD_NUM"

      - name: Stage APK Files and Generate Version Manifest
        run:
          mkdir -p public/apk &&
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/SupportService.apk &&
          BUILD_NUM=$((10 + ${{ github.run_number }})) &&
          python3 -c "import json; json.dump({'versionCode': $BUILD_NUM, 'versionName': '1.1.${{ github.run_number }}', 'appName': 'සහය සේවා', 'downloadPath': '/apk/SupportService.apk'}, open('public/apk/version.json', 'w'), indent=2)"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "Sahaya Sewa v1.1.${{ github.run_number }}"
          draft: false
          prerelease: false
          make_latest: true
          files: public/apk/SupportService.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
