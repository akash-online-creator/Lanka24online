name: Build Release APK


on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/apk/**'
      - '**.md'
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Firebase Config
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG }}" > firebase-applet-config.json
          fi
          python3 -c "
          import json, os
          valid = False
          if os.path.exists('firebase-applet-config.json'):
              try:
                  with open('firebase-applet-config.json') as f:
                      d = json.load(f)
                      if isinstance(d, dict) and d.get('projectId'):
                          valid = True
              except Exception:
                  pass
          if not valid:
              cfg = {
                  'projectId': 'gen-lang-client-0262698872',
                  'appId': '1:503381962483:web:4bda294cd68823f579d186',
                  'apiKey': 'AIzaSyBtTtuWnl4-orEHh9JkPHtkE5_z794EhpQ',
                  'authDomain': 'gen-lang-client-0262698872.firebaseapp.com',
                  'firestoreDatabaseId': 'ai-studio-sahayaseva-08bfd3be-2f42-4de8-a3a8-ad7279ec7d1f',
                  'storageBucket': 'gen-lang-client-0262698872.firebasestorage.app',
                  'messagingSenderId': '503381962483',
                  'measurementId': '',
                  'oAuthClientId': '503381962483-rh75ngs14tg41fd5728i5ef7rcjk86dn.apps.googleusercontent.com',
                  'recaptchaSiteKey': ''
              }
              with open('firebase-applet-config.json', 'w') as f:
                  json.dump(cfg, f, indent=2)
              print('Generated valid firebase-applet-config.json')
          "


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install and Build Web
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build
          mkdir -p assets/web
          cp -r dist/* assets/web/ 2>/dev/null || true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'


      - name: Precache Flutter Android Artifacts
        run: flutter precache --android


      - name: Configure Android Build & Fix Dependencies
        run: |
          flutter pub add geolocator_android:4.6.1 --dev || true
          if [ -f scripts/prepare_android.py ]; then
            python3 scripts/prepare_android.py
          fi


          python3 -c "
          import os
          p = 'android/settings.gradle'
          if os.path.exists(p):
              with open(p, 'r') as f:
                  c = f.read()
              if 'download.flutter.io' not in c:
                  c = c.replace('repositories {', 'repositories {\n        maven { url "https://storage.googleapis.com/download.flutter.io" }')
                  with open(p, 'w') as f:
                      f.write(c)
          bg = 'android/app/build.gradle'
          if os.path.exists(bg):
              with open(bg, 'r') as f:
                  bc = f.read()
              if '27.0.12077973' not in bc:
                  bc = bc.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"')
                  with open(bg, 'w') as f:
                      f.write(bc)
          "
          find android/app/src/main/res -name "ic_launcher*.xml" -delete
          rm -rf android/app/src/main/java/io

          python3 -m pip install pillow --quiet
          python3 -c "
          import os
          from PIL import Image
          densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          logo = next((p for p in ['assets/web/logo.jpg', 'assets/web/logo.png', 'public/logo.png', 'dist/logo.png'] if os.path.exists(p)), None)
          for folder, size in densities.items():
              d = os.path.join('android/app/src/main/res', folder)
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, 'ic_launcher.png')
              if logo:
                  try:
                      Image.open(logo).convert('RGBA').resize((size, size)).save(p, 'PNG')
                      continue
                  except Exception:
                      pass
              Image.new('RGBA', (size, size), (0, 122, 75, 255)).save(p, 'PNG')
          "

          FLUTTER_BIN=$(which flutter)
          FLUTTER_DIR=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "flutter.sdk=$FLUTTER_DIR" > android/local.properties

          python3 -c '
          import os
          pkg_dir = "android/app/src/main/java/com/sahayasewa/app"
          os.makedirs(pkg_dir, exist_ok=True)
          main_lines = [
              "package com.sahayasewa.app;",
              "",
              "import android.Manifest;",
              "import android.content.Context;",
              "import android.content.Intent;",
              "import android.content.pm.PackageManager;",
              "import android.net.Uri;",
              "import android.os.Build;",
              "import android.os.Bundle;",
              "import android.os.PowerManager;",
              "import android.provider.Settings;",
              "import android.view.WindowManager;",
              "import io.flutter.embedding.android.FlutterActivity;",
              "",
              "public class MainActivity extends FlutterActivity {",
              "    @Override",
              "    protected void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {",
              "            setShowWhenLocked(true);",
              "            setTurnScreenOn(true);",
              "        } else {",
              "            getWindow().addFlags(",
              "                WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED +",
              "                WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON +",
              "                WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD +",
              "                WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON",
              "            );",
              "        }",
              "        if (Build.VERSION.SDK_INT >= 33) {",
              "            if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {",
              "                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);",
              "            }",
              "        }",
              "        requestDisableBatteryOptimization();",
              "        startRedAlertService();",
              "    }",
              "",
              "    private void requestDisableBatteryOptimization() {",
              "        try {",
              "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {",
              "                PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);",
              "                String pkg = getPackageName();",
              "                if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) {",
              "                    Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);",
              "                    intent.setData(Uri.parse(\"package:\" + pkg));",
              "                    startActivity(intent);",
              "                }",
              "            }",
              "        } catch (Exception ignored) {}",
              "    }",
              "",
              "    private void startRedAlertService() {",
              "        try {",
              "            Intent svc = new Intent(this, RedAlertMonitorService.class);",
              "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
              "                startForegroundService(svc);",
              "            } else {",
              "                startService(svc);",
              "            }",
              "        } catch (Exception ignored) {}",
              "    }",
              "}"
          ]
          svc_lines = [
              "package com.sahayasewa.app;",
              "",
              "import android.app.AlarmManager;",
              "import android.app.Notification;",
              "import android.app.NotificationChannel;",
              "import android.app.NotificationManager;",
              "import android.app.PendingIntent;",
              "import android.app.Service;",
              "import android.content.Context;",
              "import android.content.Intent;",
              "import android.content.SharedPreferences;",
              "import android.media.AudioAttributes;",
              "import android.media.Ringtone;",
              "import android.media.RingtoneManager;",
              "import android.net.Uri;",
              "import android.os.Build;",
              "import android.os.Handler;",
              "import android.os.IBinder;",
              "import android.os.Looper;",
              "import android.os.PowerManager;",
              "import android.os.SystemClock;",
              "import android.os.VibrationEffect;",
              "import android.os.Vibrator;",
              "import java.io.BufferedReader;",
              "import java.io.InputStreamReader;",
              "import java.net.HttpURLConnection;",
              "import java.net.URL;",
              "import java.util.concurrent.ExecutorService;",
              "import java.util.concurrent.Executors;",
              "import org.json.JSONArray;",
              "import org.json.JSONObject;",
              "",
              "public class RedAlertMonitorService extends Service {",
              "    private static final String MONITOR_CHANNEL_ID = \"sahaya_bg_monitor_channel\";",
              "    private static final String ALERT_CHANNEL_ID = \"sahaya_emergency_red_alert_native\";",
              "    private final ExecutorService executor = Executors.newSingleThreadExecutor();",
              "    private final Handler handler = new Handler(Looper.getMainLooper());",
              "    private boolean isRunning = false;",
              "",
              "    private final Runnable pollRunnable = new Runnable() {",
              "        @Override",
              "        public void run() {",
              "            if (!isRunning) return;",
              "            executor.execute(new Runnable() {",
              "                @Override",
              "                public void run() {",
              "                    checkFirestoreRedAlerts();",
              "                }",
              "            });",
              "            handler.postDelayed(this, 5000);",
              "        }",
              "    };",
              "",
              "    @Override",
              "    public void onCreate() {",
              "        super.onCreate();",
              "        createChannels();",
              "        Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O",
              "            ? new Notification.Builder(this, MONITOR_CHANNEL_ID)",
              "            : new Notification.Builder(this);",
              "        Intent openIntent = new Intent(this, MainActivity.class);",
              "        int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0;",
              "        PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, flags);",
              "        Notification notif = builder",
              "            .setContentTitle(\"\\u0dc3\\u0dc4\\u0dba \\u0dc3\\u0dda\\u0dc0\\u0dcf 24/7 \\u0dbb\\u0dad\\u0dd4 \\u0d91\\u0dc5\\u0dd2\\u0dba \\u0d86\\u0dbb\\u0d9a\\u0dca\\u0dc2\\u0dcf\\u0dc0\")",
              "            .setContentText(\"\\u0d87\\u0db4\\u0dca \\u0d91\\u0d9a Clear \\u0d9a\\u0dc5\\u0dad\\u0dca \\u0dc4\\u0daf\\u0dd2\\u0dc3\\u0dd2 \\u0d86\\u0db4\\u0daf\\u0dcf \\u0daf\\u0dd0\\u0db1\\u0dd4\\u0db8\\u0dca\\u0daf\\u0dd3\\u0db8\\u0dca 24/7 \\u0dc3\\u0d9a\\u0dca\\u200d\\u0dbb\\u0dd3\\u0dba\\u0dba\\u0dd2\")",
              "            .setSmallIcon(android.R.drawable.ic_dialog_info)",
              "            .setContentIntent(pendingIntent)",
              "            .setOngoing(true)",
              "            .build();",
              "        startForeground(7771, notif);",
              "    }",
              "",
              "    @Override",
              "    public int onStartCommand(Intent intent, int flags, int startId) {",
              "        if (!isRunning) {",
              "            isRunning = true;",
              "            handler.post(pollRunnable);",
              "        }",
              "        return START_STICKY;",
              "    }",
              "",
              "    @Override",
              "    public void onTaskRemoved(Intent rootIntent) {",
              "        try {",
              "            Intent restartIntent = new Intent(getApplicationContext(), RedAlertMonitorService.class);",
              "            restartIntent.setPackage(getPackageName());",
              "            int pFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M",
              "                ? PendingIntent.FLAG_ONE_SHOT + PendingIntent.FLAG_IMMUTABLE",
              "                : PendingIntent.FLAG_ONE_SHOT;",
              "            PendingIntent restartPi = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O",
              "                ? PendingIntent.getForegroundService(getApplicationContext(), 1, restartIntent, pFlags)",
              "                : PendingIntent.getService(getApplicationContext(), 1, restartIntent, pFlags);",
              "            AlarmManager am = (AlarmManager) getApplicationContext().getSystemService(Context.ALARM_SERVICE);",
              "            if (am != null) {",
              "                am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 1000, restartPi);",
              "            }",
              "        } catch (Exception ignored) {}",
              "        super.onTaskRemoved(rootIntent);",
              "    }",
              "",
              "    @Override",
              "    public void onDestroy() {",
              "        isRunning = false;",
              "        handler.removeCallbacks(pollRunnable);",
              "        super.onDestroy();",
              "    }",
              "",
              "    @Override",
              "    public IBinder onBind(Intent intent) {",
              "        return null;",
              "    }",
              "",
              "    private void createChannels() {",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
              "            NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);",
              "            if (nm == null) return;",
              "            NotificationChannel monitorChan = new NotificationChannel(",
              "                MONITOR_CHANNEL_ID,",
              "                \"Sahaya Sewa 24/7 Background Monitor\",",
              "                NotificationManager.IMPORTANCE_LOW",
              "            );",
              "            nm.createNotificationChannel(monitorChan);",
              "",
              "            NotificationChannel alertChan = new NotificationChannel(",
              "                ALERT_CHANNEL_ID,",
              "                \"\\uD83D\\uDEA8 \\u0dbb\\u0dad\\u0dd4 \\u0d91\\u0dc5\\u0dd2\\u0dba \\u0dc4\\u0daf\\u0dd2\\u0dc3\\u0dd2 \\u0d86\\u0db4\\u0daf\\u0dcf \\u0dc3\\u0dba\\u0dd2\\u0dbb\\u0db1\\u0dba\",",
              "                NotificationManager.IMPORTANCE_HIGH",
              "            );",
              "            alertChan.enableVibration(true);",
              "            alertChan.setVibrationPattern(new long[]{0, 1000, 300, 1000, 300, 1500});",
              "            Uri alarmSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);",
              "            if (alarmSound == null) {",
              "                alarmSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);",
              "            }",
              "            AudioAttributes attrs = new AudioAttributes.Builder()",
              "                .setUsage(AudioAttributes.USAGE_ALARM)",
              "                .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)",
              "                .build();",
              "            alertChan.setSound(alarmSound, attrs);",
              "            nm.createNotificationChannel(alertChan);",
              "        }",
              "    }",
              "",
              "    private void checkFirestoreRedAlerts() {",
              "        String[] urls = new String[]{",
              "            \"https://firestore.googleapis.com/v1/projects/gen-lang-client-0262698872/databases/ai-studio-sahayaseva-08bfd3be-2f42-4de8-a3a8-ad7279ec7d1f/documents/red_alerts?pageSize=10\",",
              "            \"https://firestore.googleapis.com/v1/projects/gen-lang-client-0536295842/databases/(default)/documents/red_alerts?pageSize=10\"",
              "        };",
              "        SharedPreferences prefs = getSharedPreferences(\"sahaya_native_alerts\", MODE_PRIVATE);",
              "        for (String urlStr : urls) {",
              "            HttpURLConnection conn = null;",
              "            try {",
              "                URL url = new URL(urlStr);",
              "                conn = (HttpURLConnection) url.openConnection();",
              "                conn.setRequestMethod(\"GET\");",
              "                conn.setConnectTimeout(4000);",
              "                conn.setReadTimeout(4000);",
              "                if (conn.getResponseCode() != 200) continue;",
              "                BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));",
              "                StringBuilder sb = new StringBuilder();",
              "                String line;",
              "                while ((line = reader.readLine()) != null) {",
              "                    sb.append(line);",
              "                }",
              "                reader.close();",
              "                JSONObject json = new JSONObject(sb.toString());",
              "                if (!json.has(\"documents\")) continue;",
              "                JSONArray docs = json.getJSONArray(\"documents\");",
              "                for (int i = 0; i != docs.length(); i++) {",
              "                    JSONObject doc = docs.getJSONObject(i);",
              "                    String fullName = doc.optString(\"name\", \"\");",
              "                    String[] parts = fullName.split(\"/\");",
              "                    String docId = parts.length > 0 ? parts[parts.length - 1] : \"\";",
              "                    JSONObject fields = doc.optJSONObject(\"fields\");",
              "                    if (fields == null) continue;",
              "                    String status = getStringField(fields, \"status\", \"\");",
              "                    if (!\"active\".equals(status)) continue;",
              "                    if (docId.isEmpty()) docId = getStringField(fields, \"id\", \"\");",
              "                    if (docId.isEmpty()) continue;",
              "                    if (prefs.getBoolean(\"notified_\" + docId, false)) continue;",
              "                    prefs.edit().putBoolean(\"notified_\" + docId, true).apply();",
              "                    String titleSi = getStringField(fields, \"disasterTitleSi\", getStringField(fields, \"title\", \"\\u0dc4\\u0daf\\u0dd2\\u0dc3\\u0dd2 \\u0d86\\u0db4\\u0daf\\u0dcf \\u0d85\\u0db1\\u0dad\\u0dd4\\u0dbb\\u0dd4 \\u0d87\\u0d9f\\u0dc0\\u0dd3\\u0db8\\u0d9a\\u0dca\"));",
              "                    String locName = getStringField(fields, \"locationName\", \"\\u0dc1\\u0dca\\200d\\u0dbb\\u0dd3 \\u0dbd\\u0d82\\u0d9a\\u0dcf\\u0dc0\");",
              "                    String desc = getStringField(fields, \"description\", \"\\u0dc0\\u0dc4\\u0dcf\\u0db8 \\u0d86\\u0dbb\\u0d9a\\u0dca\\u0dc2\\u0dd2\\u0dad \\u0db4\\u0dd2\\u0dba\\u0dc0\\u0dbb \\u0d9c\\u0db1\\u0dca\\u0db1.\");",
              "                    triggerNativeEmergencyAlert(docId, titleSi, locName, desc);",
              "                }",
              "            } catch (Exception ignored) {",
              "            } finally {",
              "                if (conn != null) conn.disconnect();",
              "            }",
              "        }",
              "    }",
              "",
              "    private String getStringField(JSONObject fields, String key, String fallback) {",
              "        JSONObject obj = fields.optJSONObject(key);",
              "        if (obj != null && obj.has(\"stringValue\")) {",
              "            return obj.optString(\"stringValue\", fallback);",
              "        }",
              "        return fallback;",
              "    }",
              "",
              "    private void triggerNativeEmergencyAlert(String docId, String titleSi, String locName, String desc) {",
              "        try {",
              "            PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);",
              "            if (pm != null) {",
              "                PowerManager.WakeLock wl = pm.newWakeLock(",
              "                    PowerManager.PARTIAL_WAKE_LOCK + PowerManager.ACQUIRE_CAUSES_WAKEUP,",
              "                    \"sahayasewa:redalert_wakelock\"",
              "                );",
              "                wl.acquire(10000);",
              "            }",
              "        } catch (Exception ignored) {}",
              "",
              "        try {",
              "            Uri alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);",
              "            if (alarmUri == null) alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);",
              "            final Ringtone ringtone = RingtoneManager.getRingtone(getApplicationContext(), alarmUri);",
              "            if (ringtone != null) {",
              "                ringtone.play();",
              "                handler.postDelayed(new Runnable() {",
              "                    @Override",
              "                    public void run() {",
              "                        try {",
              "                            if (ringtone.isPlaying()) ringtone.stop();",
              "                        } catch (Exception ignored) {}",
              "                    }",
              "                }, 12000);",
              "            }",
              "        } catch (Exception ignored) {}",
              "",
              "        try {",
              "            Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);",
              "            if (v != null) {",
              "                long[] pattern = new long[]{0, 1000, 300, 1000, 300, 1500};",
              "                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
              "                    v.vibrate(VibrationEffect.createWaveform(pattern, -1));",
              "                } else {",
              "                    v.vibrate(pattern, -1);",
              "                }",
              "            }",
              "        } catch (Exception ignored) {}",
              "",
              "        try {",
              "            NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);",
              "            if (nm == null) return;",
              "            Intent openIntent = new Intent(this, MainActivity.class);",
              "            openIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK + Intent.FLAG_ACTIVITY_CLEAR_TOP);",
              "            int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE + PendingIntent.FLAG_UPDATE_CURRENT : PendingIntent.FLAG_UPDATE_CURRENT;",
              "            PendingIntent pi = PendingIntent.getActivity(this, docId.hashCode(), openIntent, flags);",
              "",
              "            Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O",
              "                ? new Notification.Builder(this, ALERT_CHANNEL_ID)",
              "                : new Notification.Builder(this);",
              "            b.setContentTitle(\"\\uD83D\\uDEA8 \\u0dbb\\u0dad\\u0dd4 \\u0d91\\u0dc5\\u0dd2\\u0dba: \" + titleSi)",
              "             .setContentText(\"\\uD83D\\uDCCD \" + locName + \" - \" + desc)",
              "             .setSmallIcon(android.R.drawable.ic_dialog_alert)",
              "             .setContentIntent(pi)",
              "             .setAutoCancel(true);",
              "            if (!(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)) {",
              "                b.setPriority(Notification.PRIORITY_MAX);",
              "            }",
              "            nm.notify(Math.abs(docId.hashCode()), b.build());",
              "        } catch (Exception ignored) {}",
              "    }",
              "}"
          ]
          with open(os.path.join(pkg_dir, "MainActivity.java"), "w") as f:
              f.write(chr(10).join(main_lines) + chr(10))
          with open(os.path.join(pkg_dir, "RedAlertMonitorService.java"), "w") as f:
              f.write(chr(10).join(svc_lines) + chr(10))
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = ["android.permission.INTERNET", "android.permission.WAKE_LOCK", "android.permission.VIBRATE", "android.permission.FOREGROUND_SERVICE", "android.permission.POST_NOTIFICATIONS", "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "android.permission.SCHEDULE_EXACT_ALARM"]
              perm_tags = ""
              for p in perms:
                  if p not in m:
                      perm_tags += chr(60) + "uses-permission android:name=\"" + p + "\"" + chr(47) + chr(62) + chr(10) + "    "
              if perm_tags:
                  m = m.replace(chr(60) + "application", perm_tags + chr(60) + "application", 1)
              if "RedAlertMonitorService" not in m:
                  svc_tag = "    " + chr(60) + "service android:name=\".RedAlertMonitorService\" android:enabled=\"true\" android:exported=\"false\" android:stopWithTask=\"false\"" + chr(47) + chr(62) + chr(10) + "    " + chr(60) + chr(47) + "application" + chr(62)
                  m = m.replace(chr(60) + chr(47) + "application" + chr(62), svc_tag, 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          '

      - name: Build Android Release APK
        run:
          flutter clean &&
          flutter pub get &&
          BUILD_NUM=$((10 + ${{ github.run_number }})) &&
          flutter build apk --release --no-tree-shake-icons --build-name="1.1.${{ github.run_number }}" --build-number="$BUILD_NUM"

      - name: Stage APK Files and Generate Version Manifest
        run:
          mkdir -p public/apk &&
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/SupportService.apk &&
          BUILD_NUM=$((10 + ${{ github.run_number }})) &&
          python3 -c "import json; json.dump({'versionCode': $BUILD_NUM, 'versionName': '1.1.${{ github.run_number }}', 'appName': 'සහය සේවා', 'downloadPath': '/apk/SupportService.apk'}, open('public/apk/version.json', 'w'), indent=2)"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "Sahaya Sewa v1.1.${{ github.run_number }}"
          draft: false
          prerelease: false
          make_latest: true
          files: public/apk/SupportService.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
