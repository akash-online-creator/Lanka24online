name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Standalone Web Application Bundle
        run: |
          echo "Building production React SPA assets..."
          npm install --legacy-peer-deps
          npx vite build
          mkdir -p assets/web
          cp -r dist/* assets/web/
          ls -lh assets/web/

      - name: Set up Python & Pillow for Image Processing
        run: |
          python3 -m pip install --upgrade pillow

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Scaffold Flutter Android Platform & Branding
        run: |
          echo "Generating official Android platform binding..."
          rm -rf /tmp/scaffold
          flutter create --platforms=android --project-name=sahayasewa_mobile --org=com.sahayasewa /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          rm -rf /tmp/scaffold
          python3 scripts/prepare_android.py

      - name: Configure Android Build & Manifest Permissions
        run: |
          # 1. Clean root android/build.gradle
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url 'https://storage.googleapis.com/download.flutter.io'
                  }
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 2. Configure app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true

          # 3. Inject Google Find Hub style 24/7 Background & System Permissions into AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # Re-apply branding icons and clean conflicting XMLs
          python3 scripts/prepare_android.py

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Patch Third-Party Plugins for SDK 34 & AGP 8 Compatibility
        run: |
          echo "Patching pub-cache plugins..."
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/project.android.flutter.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/21/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} + || true

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Output
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahayaSewa-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
