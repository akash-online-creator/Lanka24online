name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/apk/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Flutter Assets
        run: |
          mkdir -p assets/web
          cp -r dist/* assets/web/ 2>/dev/null || true
          cp -r public/* assets/web/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Android Configuration
        run: |
          if [ -f scripts/prepare_android.py ]; then
            python3 scripts/prepare_android.py
          else
            echo "scripts/prepare_android.py not found, skipping."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Stage APK Files & Generate Version Manifest
        run: |
          mkdir -p public/apk
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/sahayasewa-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/app-release.apk
          
          cat <<EOF > public/apk/version.json
          {
            "versionCode": 2,
            "versionName": "1.1",
            "appName": "Sahaya Sewa",
            "downloadPath": "/apk/sahayasewa-latest.apk",
            "updatedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "releaseNotes": "ස්ථානය සුරකින්න (Saved Places) සහ නව යාවත්කාලීන කිරීම් ඇතුළත් කර ඇත."
          }
          EOF
          
          echo "Files staged successfully:"
          ls -lh public/apk/

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1
          name: "Sahaya Sewa v1.1"
          body: |
            🚀 **Sahaya Sewa (සහය සේවා) Official Release v1.1**
            
            - ✅ නව ස්ථානය සුරකින්න (Saved Places) විශේෂාංගය
            - ✅ Admin අවසර සහ සංස්කරණ පහසුකම්
            - ✅ In-App Direct Download & Update සහාය
          draft: false
          prerelease: false
          make_latest: true
          files: |
            public/apk/sahayasewa-latest.apk
            public/apk/app-release.apk
            public/apk/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK to Repository (for Web/Vercel Hosting)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apk/sahayasewa-latest.apk public/apk/app-release.apk public/apk/version.json
          git commit -m "chore(release): publish latest APK v1.1 [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Upload APK Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sahayasewa-release-apk
          path: public/apk/sahayasewa-latest.apk
          retention-days: 1
