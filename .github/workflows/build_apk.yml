name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/apk/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Flutter Assets
        run: |
          mkdir -p assets/web
          cp -r dist/* assets/web/ 2>/dev/null || true
          cp -r public/* assets/web/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Precache Flutter Android Artifacts
        run: flutter precache --android

      - name: Configure Android Build & Fix Dependencies
        run: |
          if [ -f scripts/prepare_android.py ]; then
            python3 scripts/prepare_android.py
          fi

          # 1. Clean up duplicate launcher icons
          find android/app/src/main/res -type f -name "ic_launcher.xml" -delete || true
          find android/app/src/main/res/mipmap-* -type f -name "*.xml" -not -path "*/mipmap-anydpi*/*" -delete || true

          # 2. Ensure Flutter SDK path in local.properties
          FLUTTER_BIN=$(which flutter)
          FLUTTER_DIR=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "flutter.sdk=$FLUTTER_DIR" > android/local.properties

          # 3. Add Flutter Maven repository & libs support to gradle files
          python3 -c "
          import os

          # Update root build.gradle
          if os.path.exists('android/build.gradle'):
              with open('android/build.gradle', 'r') as f:
                  content = f.read()
              if 'download.flutter.io' not in content:
                  content = content.replace('mavenCentral()', \"mavenCentral()\\n        maven { url 'https://storage.googleapis.com/download.flutter.io' }\")
                  with open('android/build.gradle', 'w') as f:
                      f.write(content)
                  print('Added download.flutter.io to android/build.gradle')

          # Update app/build.gradle
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f:
                  app_content = f.read()
              if 'fileTree' not in app_content or 'libs' not in app_content:
                  app_content = app_content.replace('dependencies {', \"dependencies {\\n    compileOnly fileTree(dir: 'libs', include: ['*.jar'])\")
                  with open('android/app/build.gradle', 'w') as f:
                      f.write(app_content)
                  print('Added compileOnly libs to android/app/build.gradle')

          # Update settings.gradle if dependencyResolutionManagement is used
          if os.path.exists('android/settings.gradle'):
              with open('android/settings.gradle', 'r') as f:
                  st = f.read()
              if 'dependencyResolutionManagement' in st and 'download.flutter.io' not in st:
                  st = st.replace('mavenCentral()', \"mavenCentral()\\n        maven { url 'https://storage.googleapis.com/download.flutter.io' }\")
                  with open('android/settings.gradle', 'w') as f:
                      f.write(st)
                  print('Added download.flutter.io to android/settings.gradle')
          "

          # 4. Copy flutter_embedding jar directly to android/app/libs for Kotlin resolution
          mkdir -p android/app/libs
          JAR_FILE=$(find "$FLUTTER_DIR/bin/cache/artifacts/engine" -name "flutter_embedding_release.jar" 2>/dev/null | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            JAR_FILE=$(find "$FLUTTER_DIR" -name "flutter_embedding_*.jar" 2>/dev/null | head -n 1)
          fi
          if [ -n "$JAR_FILE" ]; then
            cp "$JAR_FILE" android/app/libs/flutter_embedding.jar
            echo "Copied $JAR_FILE to android/app/libs/flutter_embedding.jar"
          fi

      - name: Build Android Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK Files & Generate Version Manifest
        run: |
          mkdir -p public/apk
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/sahayasewa-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk public/apk/app-release.apk
          
          cat <<EOF > public/apk/version.json
          {
            "versionCode": 2,
            "versionName": "1.1",
            "appName": "Sahaya Sewa",
            "downloadPath": "/apk/sahayasewa-latest.apk",
            "updatedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "releaseNotes": "ස්ථානය සුරකින්න (Saved Places) සහ නව යාවත්කාලීන කිරීම් ඇතුළත් කර ඇත."
          }
          EOF
          
          echo "Files staged successfully:"
          ls -lh public/apk/

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1
          name: "Sahaya Sewa v1.1"
          body: |
            🚀 **Sahaya Sewa (සහය සේවා) Official Release v1.1**
            
            - ✅ නව ස්ථානය සුරකින්න (Saved Places) විශේෂාංගය
            - ✅ Admin අවසර සහ සංස්කරණ පහසුකම්
            - ✅ In-App Direct Download & Update සහාය
          draft: false
          prerelease: false
          make_latest: true
          files: |
            public/apk/sahayasewa-latest.apk
            public/apk/app-release.apk
            public/apk/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK to Repository (for Web/Vercel Hosting)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apk/sahayasewa-latest.apk public/apk/app-release.apk public/apk/version.json
          git commit -m "chore(release): publish latest APK v1.1 [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Upload APK Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sahayasewa-release-apk
          path: public/apk/sahayasewa-latest.apk
          retention-days: 1
