name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Build React Web Bundle
        run: |
          npm ci || npm install
          npm run build
          mkdir -p assets/web
          ls -la assets/web

      - name: Flutter Scaffold & Platform Bindings
        run: |
          mkdir -p lib
          flutter create --platforms=android --org=com.sahayasewa . || true
          python3 scripts/prepare_android.py || true

          # Configure compileSdk 35, minSdk 21 & multiDex in app/build.gradle
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdk/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk flutter.compileSdk/compileSdk 35/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Patch plugins for compileSdk 35
        run: |
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' {} + || true
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdk 34/compileSdk 35/g' {} + || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahayaSewa-24x7-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
