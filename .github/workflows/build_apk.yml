name: Build Release APK
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/apk/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Firebase Config
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG }}" > firebase-applet-config.json
          fi
          python3 -c "
          import json, os
          valid = False
          if os.path.exists('firebase-applet-config.json'):
              try:
                  with open('firebase-applet-config.json') as f:
                      d = json.load(f)
                      if isinstance(d, dict) and d.get('projectId'):
                          valid = True
              except Exception:
                  pass
          if not valid:
              cfg = dict(
                  projectId='gen-lang-client-0262698872',
                  appId='1:503381962483:web:4bda294cd68823f579d186',
                  apiKey='AIzaSyBtTtuWnl4-orEHh9JkPHtkE5_z794EhpQ',
                  authDomain='gen-lang-client-0262698872.firebaseapp.com',
                  firestoreDatabaseId='ai-studio-sahayaseva-08bfd3be-2f42-4de8-a3a8-ad7279ec7d1f',
                  storageBucket='gen-lang-client-0262698872.firebasestorage.app',
                  messagingSenderId='503381962483',
                  measurementId='',
                  oAuthClientId='503381962483-rh75ngs14tg41fd5728i5ef7rcjk86dn.apps.googleusercontent.com',
                  recaptchaSiteKey=''
              )
              with open('firebase-applet-config.json', 'w') as f:
                  json.dump(cfg, f, indent=2)
              print('Generated valid firebase-applet-config.json')
          "
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and Build Web
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build
          mkdir -p assets/web
          cp -r dist/* assets/web/ 2>/dev/null || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Precache Flutter Android Artifacts
        run: flutter precache --android
      - name: Configure Android Build & Fix Dependencies
        run: |
          flutter pub add geolocator_android:4.6.1 --dev || true
          if [ -f scripts/prepare_android.py ]; then
            python3 scripts/prepare_android.py
          fi
          rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
          python3 -c '
          import os
          os.makedirs("android/app", exist_ok=True)
          settings_lines = [
              "pluginManagement \x7b",
              "    def flutterSdkPath = \x7b",
              "        def properties = new Properties()",
              "        file(\"local.properties\").withInputStream \x7b properties.load(it) \x7d",
              "        def flutterSdkPath = properties.getProperty(\"flutter.sdk\")",
              "        assert flutterSdkPath != null, \"flutter.sdk not set in local.properties\"",
              "        return flutterSdkPath",
              "\x7d()",
              "",
              "    includeBuild(\"$flutterSdkPath/packages/flutter_tools/gradle\")",
              "",
              "    repositories \x7b",
              "        google()",
              "        mavenCentral()",
              "        gradlePluginPortal()",
