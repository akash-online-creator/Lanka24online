workflows:
  android-workflow:
    name: Sahaya Sewa Android APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: 3.24.0
      java: 17
      vars:
        PACKAGE_NAME: "com.sahayasewa.app"
    scripts:
      - name: Verify Flutter Project Root & Setup
        script: |
          echo "Setting up Flutter project structure..."
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter doctor -v
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK Release
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - www.akash.online@gmail.com
        notify:
          success: true
          failure: true
