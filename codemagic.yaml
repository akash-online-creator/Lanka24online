workflows:
  android-workflow:
    name: Sahaya Sewa Android APK Build
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up Android properties
        script: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - www.akash.online@gmail.com
        notify:
          success: true
          failure: true
